name: Deploy iCanCare ERPNext App

on:
  push:
    branches:
      - icancare-custom
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production Server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🚀 Starting iCanCare ERPNext App Deployment..."
            
            # Create backup and deployment script with error handling
            cat > /tmp/deploy_erpnext.sh << 'DEPLOY_SCRIPT'
            #!/bin/bash
            set -e  # Exit on any error
            
            echo "🚀 Starting ERPNext deployment with error handling..."
            
            # Function to handle errors
            handle_error() {
                echo "❌ Error occurred during ERPNext deployment!"
                echo "🔄 Rolling back changes..."
                
                # Rollback git changes
                cd /home/frappe/icancare-bench/apps/erpnext
                git reset --hard HEAD~1 2>/dev/null || echo "No rollback needed"
                
                # Restart services to ensure stability
                sudo supervisorctl restart all || echo "Supervisor restart failed"
                sudo systemctl restart nginx || echo "Nginx restart failed"
                
                echo "🛡️ ERPNext rollback completed. Server should be stable."
                exit 1
            }
            
            # Set error trap
            trap handle_error ERR
            
            # Switch to frappe user and activate environment
            sudo su - frappe << 'EOF'
            set -e  # Exit on any error in frappe session
            source frappe-env/bin/activate
            cd icancare-bench
            
            # Check if site is accessible before deployment
            echo "🔍 Pre-deployment health check..."
            bench --site icancare.com doctor || echo "Warning: Site health check failed"
            
            # Create backup before deployment
            echo "💾 Creating backup before ERPNext deployment..."
            bench --site icancare.com backup --with-files || echo "Backup failed, continuing..."
            
            # Pull latest changes from ERPNext app
            echo "📥 Pulling latest changes for ERPNext..."
            cd apps/erpnext
            git pull origin icancare-custom || exit 1
            cd ../..
            
            # Build assets with error checking
            echo "🔨 Building assets..."
            bench build --force || exit 1
            
            # Migrate database if needed with error checking
            echo "⬆️ Running migrations..."
            bench migrate || exit 1
            
            # Clear all caches
            echo "🧹 Clearing caches..."
            bench --site icancare.com clear-cache || echo "Cache clear failed, continuing..."
            bench --site icancare.com clear-website-cache || echo "Website cache clear failed, continuing..."
            
            echo "✅ iCanCare ERPNext App operations completed successfully!"
            EOF
            
            echo "✅ ERPNext deployment script completed!"
            DEPLOY_SCRIPT
            
            # Make script executable and run it
            chmod +x /tmp/deploy_erpnext.sh
            /tmp/deploy_erpnext.sh
            
            # Restart services (production method - as ubuntu user)
            echo "🔄 Restarting production services..."
            sudo supervisorctl restart all || {
                echo "❌ Supervisor restart failed! Manual intervention needed."
                exit 1
            }
            
            sudo systemctl restart nginx || {
                echo "❌ Nginx restart failed! Manual intervention needed."
                exit 1
            }
            
            echo "✅ Services restarted successfully!"
            
            # Final health check
            echo "🏥 Final health check..."
            sleep 5  # Wait for services to start
            curl -f https://health.dev.icancare.com/api/method/ping || {
                echo "❌ Site not responding after ERPNext deployment!"
                echo "🚨 CRITICAL: Manual check required!"
                exit 1
            }
            
            echo "🎉 ERPNext deployment completed successfully and site is responding!"
            
      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🔍 Verifying ERPNext deployment..."
            curl -f https://health.dev.icancare.com/api/method/ping || echo "❌ Server not responding"
            echo "✅ ERPNext deployment verification completed"
            
      - name: Notify Success
        if: success()
        run: |
          echo "🎉 iCanCare ERPNext App deployed successfully!"
          echo "🌐 Access your site at: http://${{ secrets.SERVER_HOST }}"
          
      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ ERPNext deployment failed! Check the logs above."
